<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Comentários por Post</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        select {
            padding: 8px;
            min-width: 280px;
            display: block;
            margin-top: 5px;
        }

        .comentario {
            border: 1px solid #aaa;
            margin-bottom: 12px;
            padding: 12px;
            background-color: #fcfcfc;
        }

        .comentario h4 {
            margin: 0 0 8px 0;
            font-size: 1.1rem;
        }

        .comentario p {
            margin: 4px 0;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <h1>Comentários por Post</h1>

    <label for="post">Selecione um post:</label>
    <select id="post">
        <option value="">Selecione um post</option>
    </select>

    <h2 id="tituloSecao">Comentários (0)</h2>
    <div id="containerComentarios"></div>

    <script>
        const posts = [
            { id: 1, title: "Introdução ao DOM" },
            { id: 2, title: "Eventos em JavaScript" },
            { id: 3, title: "O que é uma API?" }
        ];

        const comentarios = [
            { postId: 1, id: 1, name: "Ana", email: "ana@email.com", body: "Explicação muito clara!" },
            { postId: 1, id: 2, name: "Bruno", email: "bruno@email.com", body: "Gostei do exemplo do getElementById." },
            { postId: 2, id: 3, name: "Carla", email: "carla@email.com", body: "addEventListener é bem melhor que onclick." },
            { postId: 3, id: 4, name: "Diego", email: "diego@email.com", body: "A analogia do garçom ajudou muito." },
            { postId: 3, id: 5, name: "Elisa", email: "elisa@email.com", body: "Quero testar o JSONPlaceholder!" },
            { postId: 3, id: 6, name: "Fábio", email: "fabio@email.com", body: "E o método POST, como funciona?" }
        ];

        const seletorPost = document.getElementById("post");
        const tituloContador = document.getElementById("tituloSecao");
        const painelComentarios = document.getElementById("containerComentarios");

        for (const post of posts) {
            const itemOpcao = document.createElement("option");
            itemOpcao.value = post.id;
            itemOpcao.textContent = post.title;
            seletorPost.appendChild(itemOpcao);
        }

        seletorPost.addEventListener("change", () => {
            painelComentarios.innerHTML = "";

            const idEscolhido = parseInt(seletorPost.value, 10);

            if (!idEscolhido) {
                tituloContador.textContent = "Comentários (0)";
                return;
            }

            const comentariosFiltrados = comentarios.filter(comentario => comentario.postId === idEscolhido);

            tituloContador.textContent = `Comentários (${comentariosFiltrados.length})`;

            for (const item of comentariosFiltrados) {
                const cardComentario = document.createElement("div");
                cardComentario.className = "comentario";

                cardComentario.innerHTML = `
                    <h4>${item.name}</h4>
                    <p><strong>E-mail:</strong> ${item.email}</p>
                    <p>${item.body}</p>
                `;

                painelComentarios.appendChild(cardComentario);
            }
        });
    </script>

</body>
</html>
